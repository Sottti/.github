name: Repository validation

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'Sottti/.github' &&
      (github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR merge revision or trusted manual develop revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test invalid shared files and policy drift
        run: python3 -m unittest discover -s tests
      - name: Validate shared community files and the branch policy
        run: python3 scripts/validate_repository.py
